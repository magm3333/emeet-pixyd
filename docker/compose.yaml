services:
  emeet-pixyd:
    image: magm3333/emeet-pixy-dual-cam:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${IMAGE_VERSION:-dev}
        INSTALL_DESKTOP_TOOLS: ${INSTALL_DESKTOP_TOOLS:-0}
    container_name: emeet-pixyd
    restart: unless-stopped
    init: true
    user: "${PIXY_UID:-1000}:${PIXY_GID:-1000}"
    group_add:
      - "${PIXY_VIDEO_GID:-44}"
      - "${PIXY_HIDRAW_GID:-46}"
      - "${PIXY_AUDIO_GID:-29}"
    devices:
      - "${PIXY_VIDEO_DEVICE:-/dev/video0}:${PIXY_VIDEO_CONTAINER_DEVICE:-/dev/video0}:rw"
      - "${PIXY_HIDRAW_DEVICE:-/dev/hidraw4}:${PIXY_HIDRAW_CONTAINER_DEVICE:-/dev/hidraw4}:rw"
      - "${PIXY_AUDIO_CONTROL_DEVICE:-/dev/snd/controlC2}:${PIXY_AUDIO_CONTROL_CONTAINER_DEVICE:-/dev/snd/controlC2}:rw"
      - "${PIXY_AUDIO_PCM_DEVICE:-/dev/snd/pcmC2D0c}:${PIXY_AUDIO_PCM_CONTAINER_DEVICE:-/dev/snd/pcmC2D0c}:rw"
    extra_hosts:
      - "nv:${RTSP_HOST_IP:-host-gateway}"
    ports:
      - "0.0.0.0:${PIXY_WEB_PORT:-18090}:8090"
    volumes:
      - "${PIXY_STATE_DIR:-./data}:/var/lib/emeet-pixyd"
    environment:
      EMEET_PIXYD_STATE_DIR: /var/lib/emeet-pixyd
      EMEET_PIXYD_WEB_ADDR: 0.0.0.0:8090
      # Call detection scans /proc. It is opt-in because a container's private
      # PID namespace cannot see host conferencing applications.
      EMEET_PIXYD_AUTO: ${EMEET_PIXYD_AUTO:-off}
      EMEET_PIXYD_DEFAULT_AUDIO: ${EMEET_PIXYD_DEFAULT_AUDIO:-nc}
      EMEET_PIXYD_DEBUG: ${EMEET_PIXYD_DEBUG:-false}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/lib/emeet-pixyd/control.sock"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
